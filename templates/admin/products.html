{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="section-header">
      <h2>Manage Products</h2>
      <p>Add, edit, or remove items in the glow catalog.</p>
    </div>

    <div class="panel-card mb-4">
      <h5>Add New Product</h5>
      <form method="post" action="/admin/products/add" class="row g-3">
        <div class="col-md-6">
          <input class="form-control" name="name" placeholder="Name" required />
        </div>
        <div class="col-md-6">
          <input class="form-control" name="category" placeholder="Category" required />
        </div>
        <div class="col-md-12">
          <textarea class="form-control" name="description" placeholder="Description" rows="2" required></textarea>
        </div>
        <div class="col-md-4">
          <input class="form-control" name="price" type="number" step="0.01" placeholder="Price" required />
        </div>
        <div class="col-md-4">
          <input class="form-control" name="stock" type="number" placeholder="Stock" required />
        </div>
        <div class="col-md-4">
          <input class="form-control" name="image_url" placeholder="Image URL" required />
        </div>
        <div class="col-12">
          <button class="btn btn-glossy" type="submit">Add Product</button>
        </div>
      </form>
    </div>

    <div class="row g-4">
      {% for product in products %}
      <div class="col-12">
        <div class="product-row">
          <div class="product-row-info">
            <img src="{{ product.image_url }}" alt="{{ product.name }}" />
            <div>
              <h5>{{ product.name }}</h5>
              <p>{{ product.description }}</p>
              <div class="tag">{{ product.category }}</div>
            </div>
          </div>
          <div class="product-row-actions">
            <form method="post" action="/admin/products/{{ product.id }}/edit" class="row g-2">
              <input class="form-control" name="name" value="{{ product.name }}" required />
              <input class="form-control" name="category" value="{{ product.category }}" required />
              <input class="form-control" name="price" type="number" step="0.01" value="{{ product.price }}" required />
              <input class="form-control" name="stock" type="number" value="{{ product.stock }}" required />
              <input class="form-control" name="image_url" value="{{ product.image_url }}" required />
              <textarea class="form-control" name="description" rows="2" required>{{ product.description }}</textarea>
              <button class="btn btn-glossy-outline" type="submit">Save</button>
            </form>
            <form method="post" action="/admin/products/{{ product.id }}/delete">
              <button class="btn btn-glossy" type="submit">Delete</button>
            </form>
          </div>
        </div>
      </div>
      {% else %}
      <div class="col-12">
        <div class="empty-state">No products yet.</div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
